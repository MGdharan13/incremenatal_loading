services:
  # MySQL Database Service
  mysql:
    image: mysql:8.4
    container_name: etl_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - etl_network

  # PySpark ETL Web Application
  etl-web:
    build: .
    container_name: etl_web_ui
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=employee_db
      - DB_USER=root
      - DB_PASSWORD=root
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./web:/app/web
      - ./app.py:/app/app.py
      - ./config.py:/app/config.py
      - ./main.py:/app/main.py
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - etl_network

volumes:
  mysql_data:

networks:
  etl_network:
    driver: bridge
